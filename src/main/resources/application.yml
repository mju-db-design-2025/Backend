server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:classpath:/application-secret.yml 

  datasource:
    url: jdbc:mysql://localhost:3305/project_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true